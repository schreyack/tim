# TIM Standards - Native (C++ / Swift / Python) Pre-commit Configuration
# Base template - used by bin/sync-pre-commit
#
# For native desktop projects: C++17/20 + Swift/SwiftUI, with optional
# (often unpackaged) Python tooling. No backend, no k3s, no remote-first deploy.
#
# C++/Swift tools are local (brew) hooks, mirroring how the python template runs
# mypy as a local hook. Requires LLVM/clang >= 20 and swift-format + swiftlint:
#   brew install llvm swift-format swiftlint
#
# Run: pre-commit install

repos:
  # LOCKED - Prevent AI from modifying enforcement files
  - repo: local
    hooks:
      - id: protect-enforcement-files
        name: LOCKED - enforcement files require human approval to modify
        entry: "bash -c 'printf \"BLOCKED: These enforcement files require --no-verify (human approval):\\n\"; for f; do printf \"  %s\\n\" \"$f\"; done; exit 1' --"
        language: system
        files: >-
          (?x)^(
            \.gitignore|
            \.pre-commit-config\.yaml|
            \.secrets\.baseline|
            \.tim-settings-sot\.yaml|
            \.tim-no-fallback\.yaml|
            \.tim-no-suppression\.yaml|
            \.tim-ai-cheat\.yaml
          )$

  # ── C++ (Gate 1) ───────────────────────────────────────────────────────────
  # Requires LLVM/clang >= 20 (RealtimeSanitizer). Install: brew install llvm
  # clang-format autofixes in place (mirrors ruff-format); commit fails if it
  # changed anything, then re-stage - same flow as the python template.
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format (C++ formatting, in place)
        entry: clang-format -i --style=file
        language: system
        files: \.(h|hpp|hh|cc|cpp|cxx)$

      # clang-tidy finds compile_commands.json by walking up from each file.
      # --warnings-as-errors=* is the C++ analogue of "100% type safety".
      # readability-function-size / -cognitive-complexity in the project-provided
      # .clang-tidy enforce the 50-line / complexity-10 thresholds (TIM owns the
      # numbers; clang-tidy owns enforcement, as ESLint owns TS complexity).
      - id: clang-tidy
        name: clang-tidy (C++ lint, warnings-as-errors)
        entry: clang-tidy --quiet --warnings-as-errors=*
        language: system
        files: \.(cc|cpp|cxx)$

  # ── Swift (Gate 1) ─────────────────────────────────────────────────────────
  # swift-format formats (parallels clang-format / ruff-format); swiftlint lints
  # (parallels clang-tidy / ruff). Both run - same split as Python's
  # ruff-format + ruff. Install: brew install swift-format swiftlint
  - repo: local
    hooks:
      - id: swift-format
        name: swift-format (Swift formatting, in place)
        entry: swift-format format -i --parallel
        language: system
        files: \.swift$

      # --strict promotes warnings to errors; function_body_length /
      # cyclomatic_complexity rules in the project-provided .swiftlint.yml
      # enforce the 50-line / complexity-10 thresholds.
      - id: swiftlint
        name: swiftlint (Swift lint, strict)
        entry: swiftlint lint --strict --quiet
        language: system
        files: \.swift$
        pass_filenames: false

  # ── SHARED: secrets, commit format, file hygiene ───────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
          - --exclude-lines
          - "secretKey:|secretKeyRef:|remoteRef:|valueFrom:|secretName:"
        exclude: package-lock\.json|Package\.resolved|\.patch$

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        exclude: \.patch$|Package\.resolved$

  # ── Python (Gate 1) ────────────────────────────────────────────────────────
  # Scoped via `types: [python]` so it coexists with C++/Swift and stays
  # layout-agnostic. Narrow scope per project via .pre-commit-overrides.yaml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # MyPy - Type checking (strict mode). Python here is often UNPACKAGED.
  # Projects MUST override this hook in .pre-commit-overrides.yaml to point at
  # the correct venv path and source directories. Example:
  #
  #   disable: [mypy]
  #   repos:
  #     - repo: local
  #       hooks:
  #         - id: mypy
  #           name: mypy (strict, project venv)
  #           entry: .venv/bin/mypy --strict core/ transport/ harness/
  #           language: system
  #           pass_filenames: false
  #           always_run: true
  #
  # The default below errors clearly if the venv is not found, rather than
  # silently passing with incomplete type info.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, project venv)
        entry: "bash -c 'if [ ! -f .venv/bin/mypy ]; then echo \"ERROR: .venv/bin/mypy not found. Configure mypy hook in .pre-commit-overrides.yaml with your venv path.\"; exit 1; fi; .venv/bin/mypy --strict --exclude lib/ .'"
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.3
    hooks:
      - id: bandit
        args: [-ll]

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-no-eval
      - id: python-no-log-warn
      - id: python-use-type-annotations
      - id: text-unicode-replacement-char

  # ── SHARED: TIM enforcement tools (python-scoped) ──────────────────────────
  - repo: local
    hooks:
      - id: no-hardcoded-settings
        name: No hardcoded settings (SOT enforcement)
        entry: python3 lib/tim/tools/no-hardcoded-settings.py --language python --tier block
        language: system
        types: [python]
      - id: no-fallback-defaults
        name: No fallback defaults (fail loudly)
        entry: python3 lib/tim/tools/no-fallback-defaults.py --language python
        language: system
        types: [python]
      - id: no-suppression-comments
        name: No suppression comments (ban inline bypass)
        entry: python3 lib/tim/tools/no-suppression-comments.py --language python
        language: system
        types: [python]
      - id: detect-ai-cheats
        name: AI cheat detection (code-level enforcement evasion)
        entry: python3 lib/tim/tools/detect-ai-cheats.py --language python
        language: system
        types: [python]

  # ── Code quality + CLAUDE.md enforcement ───────────────────────────────────
  # check-code-quality.py --language native: file-size (500) for C++/Swift, full
  # file+function+complexity for Python. C++/Swift function size & complexity are
  # owned by clang-tidy / swiftlint above.
  - repo: local
    hooks:
      - id: code-quality
        name: Code quality (file size, function size, complexity)
        entry: python3 lib/tim/tools/check-code-quality.py --language native
        language: system
        files: \.(h|hpp|hh|cc|cpp|cxx|swift|py)$

      # No TODO/FIXME comments (all languages, staged files only)
      - id: no-todos
        name: No TODO/FIXME comments
        entry: "bash -c 'if grep -nE \"TODO|FIXME|XXX\" \"$@\" 2>/dev/null; then echo ERROR - Remove TODO/FIXME/XXX comments; exit 1; fi; exit 0' --"
        language: system
        files: \.(h|hpp|hh|cc|cpp|cxx|swift|py)$

      # No print debugging (python only - C++/Swift use their own logging)
      - id: no-print
        name: No print statements
        entry: "bash -c 'if grep -nE \"(^|[^a-zA-Z_])print\\(\" \"$@\" 2>/dev/null; then echo ERROR - Use logging instead of print; exit 1; fi; exit 0' --"
        language: system
        types: [python]

      # No bare except clauses (python only)
      - id: no-bare-except
        name: No bare except clauses
        entry: "bash -c 'if grep -n \"except:\" \"$@\" 2>/dev/null; then echo ERROR - Catch specific exceptions; exit 1; fi; exit 0' --"
        language: system
        types: [python]

      # No placeholder implementations (Swift fatalError-unimplemented / Python)
      - id: no-placeholders
        name: No placeholder implementations
        entry: "bash -c 'if grep -nE \"NotImplementedError|fatalError\\(\\\"unimplemented|TODO: implement\" \"$@\" 2>/dev/null; then echo ERROR - Implement fully, no placeholders; exit 1; fi; exit 0' --"
        language: system
        files: \.(swift|py)$

  # Pattern drift detection - catch unregistered dependencies (Gate 4)
  - repo: local
    hooks:
      - id: pattern-drift
        name: Pattern drift check
        entry: python3 lib/tim/tools/check-pattern-drift.py
        language: system
        pass_filenames: false
        files: (CMakeLists\.txt|Package\.swift|requirements\.txt|pyproject\.toml|\.tim-patterns\.yaml)$

# CI runs these same checks
ci:
  autofix_commit_msg: "style: auto-fix pre-commit issues"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
