# TIM Standards - Python Pre-commit Configuration
# Base template - used by bin/sync-pre-commit
# Run: pre-commit install

repos:
  # LOCKED - Prevent AI from modifying enforcement files
  - repo: local
    hooks:
      - id: protect-enforcement-files
        name: LOCKED - enforcement files require human approval to modify
        entry: "bash -c 'echo ERROR - This file is LOCKED. To modify, get human approval and use --no-verify && exit 1'"
        language: system
        files: >-
          (?x)^(
            \.pre-commit-config\.yaml|
            \.secrets\.baseline
          )$

  # Ruff - Fast linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # MyPy - Type checking (strict mode)
  #
  # Uses a local hook instead of mirrors-mypy because mirrors-mypy runs in an
  # isolated virtualenv without project dependencies, causing most imports to
  # resolve as Any and silently hiding real type errors.
  #
  # Projects MUST override this hook in .pre-commit-overrides.yaml to set the
  # correct venv path and source directories. Example:
  #
  #   disable: [mypy]
  #   repos:
  #     - repo: local
  #       hooks:
  #         - id: mypy
  #           name: mypy (strict, project venv)
  #           entry: backend/.venv/bin/mypy backend/app/ backend/tests/
  #           language: system
  #           pass_filenames: false
  #           always_run: true
  #
  # The default below is a safe fallback that will error clearly if the venv
  # is not found, rather than silently passing with incomplete type info.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, project venv)
        entry: "bash -c 'if [ ! -f .venv/bin/mypy ]; then echo \"ERROR: .venv/bin/mypy not found. Configure mypy hook in .pre-commit-overrides.yaml with your venv path.\"; exit 1; fi; .venv/bin/mypy .'"
        language: system
        pass_filenames: false
        always_run: true

  # Detect secrets - Prevent committing secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: package-lock\.json|poetry\.lock

  # Commitizen - Enforce commit message format
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-case-conflict
      - id: detect-private-key

  # Security - Bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.3
    hooks:
      - id: bandit
        args: [-ll]

  # CLAUDE.md Enforcement - Catch AI instruction violations
  - repo: local
    hooks:
      # Code quality: 400 line files, 50 line functions, complexity 10
      - id: code-quality
        name: Code quality (file size, function size, complexity)
        entry: python3 lib/tim/tools/check-code-quality.py --language python
        language: system
        types: [python]

      # Block TODO/FIXME comments
      - id: no-todos
        name: No TODO/FIXME comments
        entry: "bash -c 'if grep -rn -E \"TODO|FIXME|XXX\" --include=\"*.py\" --exclude-dir=.venv --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=lib . 2>/dev/null; then echo ERROR - Remove TODO/FIXME/XXX comments; exit 1; fi; exit 0'"
        language: system
        pass_filenames: false
        always_run: true

      # Block print statements (must use logging)
      - id: no-print
        name: No print statements
        entry: "bash -c 'if grep -rn \"[^a-zA-Z_]print(\\|^print(\" --include=\"*.py\" --exclude-dir=.venv --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=lib . 2>/dev/null | grep -v noqa; then echo ERROR - Use logging instead of print; exit 1; fi; exit 0'"
        language: system
        pass_filenames: false
        always_run: true

      # Block bare except clauses
      - id: no-bare-except
        name: No bare except clauses
        entry: "bash -c 'if grep -rn \"except:\" --include=\"*.py\" --exclude-dir=.venv --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=lib . 2>/dev/null | grep -v noqa; then echo ERROR - Catch specific exceptions; exit 1; fi; exit 0'"
        language: system
        pass_filenames: false
        always_run: true

      # Block placeholder implementations
      - id: no-placeholders
        name: No placeholder implementations
        entry: "bash -c 'if grep -rn NotImplementedError --include=\"*.py\" --exclude-dir=.venv --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=lib . 2>/dev/null; then echo ERROR - Implement fully, no NotImplementedError; exit 1; fi; exit 0'"
        language: system
        pass_filenames: false
        always_run: true

# CI runs these same checks
ci:
  autofix_commit_msg: "style: auto-fix pre-commit issues"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
