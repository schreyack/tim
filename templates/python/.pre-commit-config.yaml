# TIM Standards - Python Pre-commit Configuration
# Symlink from lib/tim/templates/python/.pre-commit-config.yaml
# Run: pre-commit install

repos:
  # Ruff - Fast linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # MyPy - Type checking (strict mode)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--strict]
        additional_dependencies:
          - pydantic>=2.0
          - types-passlib
          - types-pyjwt

  # Detect secrets - Prevent committing secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: package-lock\.json|poetry\.lock

  # Commitizen - Enforce commit message format
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-case-conflict

  # Security - Bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-r", ".", "-ll", "--exclude", ".venv,node_modules,.git,lib"]

  # CLAUDE.md Enforcement - Catch AI instruction violations
  - repo: local
    hooks:
      # Code quality: 400 line files, 50 line functions, complexity 10
      - id: code-quality
        name: Code quality (file size, function size, complexity)
        entry: python3 lib/tim/tools/check-code-quality.py . --language python
        language: system
        pass_filenames: false
        always_run: true

      # Block TODO/FIXME comments
      - id: no-todos
        name: No TODO/FIXME comments
        entry: "bash -c 'if grep -rn TODO --include=\"*.py\" --exclude-dir=.venv --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=lib . 2>/dev/null; then echo ERROR - Remove TODO/FIXME comments; exit 1; fi; exit 0'"
        language: system
        pass_filenames: false
        always_run: true

      # Block print statements (must use logging)
      - id: no-print
        name: No print statements
        entry: "bash -c 'if grep -rn \"^\\s*print(\" --include=\"*.py\" --exclude-dir=.venv --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=lib . 2>/dev/null | grep -v noqa; then echo ERROR - Use logging instead of print; exit 1; fi; exit 0'"
        language: system
        pass_filenames: false
        always_run: true

      # Block bare except clauses
      - id: no-bare-except
        name: No bare except clauses
        entry: "bash -c 'if grep -rn \"except:\" --include=\"*.py\" --exclude-dir=.venv --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=lib . 2>/dev/null | grep -v noqa; then echo ERROR - Catch specific exceptions; exit 1; fi; exit 0'"
        language: system
        pass_filenames: false
        always_run: true

      # Block placeholder implementations
      - id: no-placeholders
        name: No placeholder implementations
        entry: "bash -c 'if grep -rn NotImplementedError --include=\"*.py\" --exclude-dir=.venv --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=lib . 2>/dev/null; then echo ERROR - Implement fully, no NotImplementedError; exit 1; fi; exit 0'"
        language: system
        pass_filenames: false
        always_run: true

      # Enforce test naming convention (test_what_when_then)
      - id: test-naming
        name: Test naming convention
        entry: "bash -c 'INVALID=$(grep -rn \"^def test_\" --include=\"test_*.py\" --exclude-dir=.venv --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=lib . 2>/dev/null | grep -v _when_ | grep -v _with_ | grep -v _returns_ | grep -v _raises_ || true); if [ -n \"$INVALID\" ]; then echo ERROR - Test names must follow test_what_when_then pattern; exit 1; fi; exit 0'"
        language: system
        pass_filenames: false
        always_run: true

# CI runs these same checks
ci:
  autofix_commit_msg: "style: auto-fix pre-commit issues"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
