# TIM Design Standards - Python Pre-commit Configuration
# Copy this file to your project root
# Run: pre-commit install

repos:
  # Ruff - Fast linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # MyPy - Type checking (strict mode)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--strict, --ignore-missing-imports]
        additional_dependencies:
          - pydantic>=2.0
          - types-passlib
          - types-python-jose

  # Detect secrets - Prevent committing secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: package-lock\.json|poetry\.lock

  # Commitizen - Enforce commit message format
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-case-conflict

  # Security - Bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: [-r, src/, -ll]  # Low severity and above
        exclude: tests/

  # CLAUDE.md Enforcement - Catch AI instruction violations
  - repo: local
    hooks:
      # Block TODO/FIXME comments
      - id: no-todos
        name: No TODO/FIXME comments
        entry: bash -c 'if grep -rn "TODO\|FIXME\|XXX\|HACK" --include="*.py" src/ 2>/dev/null; then echo "ERROR: Remove TODO/FIXME comments - implement fully or do not add"; exit 1; fi; exit 0'
        language: system
        pass_filenames: false
        always_run: true

      # Block print statements (must use logging)
      - id: no-print
        name: No print statements
        entry: bash -c 'if grep -rn "^\s*print(" --include="*.py" src/ 2>/dev/null | grep -v "# noqa"; then echo "ERROR: Use logging instead of print()"; exit 1; fi; exit 0'
        language: system
        pass_filenames: false
        always_run: true

      # Block bare except clauses
      - id: no-bare-except
        name: No bare except clauses
        entry: bash -c 'if grep -rn "except:" --include="*.py" src/ 2>/dev/null | grep -v "# noqa"; then echo "ERROR: Catch specific exceptions, not bare except:"; exit 1; fi; exit 0'
        language: system
        pass_filenames: false
        always_run: true

      # Block placeholder implementations
      - id: no-placeholders
        name: No placeholder implementations
        entry: bash -c 'if grep -rn "raise NotImplementedError" --include="*.py" src/ 2>/dev/null; then echo "ERROR: Implement fully - no NotImplementedError allowed"; exit 1; fi; exit 0'
        language: system
        pass_filenames: false
        always_run: true

      # Enforce co-author line in commits
      - id: require-coauthor
        name: Require Co-Authored-By line
        entry: bash -c 'if ! grep -q "Co-Authored-By:" "$1" 2>/dev/null; then echo "ERROR: Commit must include Co-Authored-By line"; exit 1; fi'
        language: system
        stages: [commit-msg]

      # Enforce test naming convention (test_what_when_then)
      - id: test-naming
        name: Test naming convention
        entry: bash -c 'INVALID=$(grep -rn "^def test_" --include="test_*.py" tests/ 2>/dev/null | grep -v "_when_\|_with_\|_returns_\|_raises_\|_creates_\|_updates_\|_deletes_" || true); if [ -n "$INVALID" ]; then echo "ERROR: Test names must follow test_<what>_<when>_<then> pattern"; echo "$INVALID"; echo "Examples: test_login_with_valid_credentials_returns_token, test_create_user_when_email_exists_raises_error"; exit 1; fi; exit 0'
        language: system
        pass_filenames: false
        always_run: true

# CI runs these same checks
ci:
  autofix_commit_msg: "style: auto-fix pre-commit issues"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
