# TIM Design Standards - Python Project Template
# Copy this file to your project root

[tool.poetry]
name = "your-project-name"
version = "0.1.0"
description = "Your project description"
authors = ["TIM Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.0" }
asyncpg = "^0.30.0"
alembic = "^1.14.0"
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
structlog = "^24.4.0"
httpx = "^0.28.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
mypy = "^1.13.0"
ruff = "^0.8.0"
pre-commit = "^4.0.0"
types-passlib = "^1.7.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# =============================================================================
# MYPY CONFIGURATION - STRICT MODE REQUIRED
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# =============================================================================
# RUFF CONFIGURATION - LINTING AND FORMATTING
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "C901",   # McCabe complexity
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print (no print statements)
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # pylint (includes complexity checks)
    "RUF",    # ruff-specific rules
    "ASYNC",  # flake8-async
    "G",      # flake8-logging-format
    "FIX",    # flake8-fixme (blocks TODO/FIXME comments)
    "TD",     # flake8-todos (blocks TODO comments)
]
ignore = []

# CLAUDE.md Enforcement: Block TODO/FIXME comments
[tool.ruff.lint.flake8-fixme]
check = ["FIXME", "TODO", "XXX", "HACK", "BUG"]

# =============================================================================
# COMPLEXITY LIMITS - Critical for AI development
# =============================================================================
[tool.ruff.lint.mccabe]
max-complexity = 10  # Cyclomatic complexity limit

[tool.ruff.lint.pylint]
max-args = 5         # Maximum function arguments
max-branches = 12    # Maximum branches in a function
max-returns = 6      # Maximum return statements
max-statements = 50  # Maximum statements in a function (enforces ~50 line limit)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001"]  # Allow assert and unused args in tests
"alembic/*" = ["ERA001"]  # Allow comments in migrations

[tool.ruff.lint.isort]
known-first-party = ["app"]

# =============================================================================
# PYTEST CONFIGURATION
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]

# =============================================================================
# COVERAGE CONFIGURATION
# =============================================================================
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
