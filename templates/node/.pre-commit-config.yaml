# TIM Standards - Node.js Pre-commit Configuration
# Symlink from lib/tim/templates/node/.pre-commit-config.yaml
# Run: pre-commit install

repos:
  # Local hooks for Node.js tooling
  - repo: local
    hooks:
      # TypeScript type checking
      - id: tsc
        name: TypeScript type check
        entry: npx tsc --noEmit
        language: system
        types: [typescript]
        pass_filenames: false

      # ESLint with zero warnings tolerance
      - id: eslint
        name: ESLint
        entry: npx eslint --max-warnings 0 --fix
        language: system
        types: [typescript]
        pass_filenames: true

      # Prettier formatting check
      - id: prettier
        name: Prettier
        entry: npx prettier --check
        language: system
        types_or: [typescript, javascript, json, css, markdown, yaml]
        pass_filenames: true

  # Gitleaks - Detect secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Commitizen - Enforce commit message format
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  # CLAUDE.md Enforcement - Catch AI instruction violations
  - repo: local
    hooks:
      # Code quality: 400 line files max
      - id: code-quality
        name: Code quality (file size)
        entry: python3 lib/tim/tools/check-code-quality.py . --language typescript
        language: system
        pass_filenames: false
        always_run: true

      # Block TODO/FIXME comments
      - id: no-todos
        name: No TODO/FIXME comments
        entry: "bash -c 'if grep -rn TODO --include=\"*.ts\" --include=\"*.tsx\" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=lib . 2>/dev/null; then echo ERROR - Remove TODO/FIXME comments; exit 1; fi; exit 0'"
        language: system
        pass_filenames: false
        always_run: true

      # Block console.log (must use logger)
      - id: no-console
        name: No console.log
        entry: "bash -c 'if grep -rn console.log --include=\"*.ts\" --include=\"*.tsx\" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=lib . 2>/dev/null | grep -v noqa; then echo ERROR - Use logger instead of console.log; exit 1; fi; exit 0'"
        language: system
        pass_filenames: false
        always_run: true

      # Block any type
      - id: no-any
        name: No any type
        entry: "bash -c 'if grep -rn \": any\" --include=\"*.ts\" --include=\"*.tsx\" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=lib . 2>/dev/null | grep -v noqa; then echo ERROR - Use proper types instead of any; exit 1; fi; exit 0'"
        language: system
        pass_filenames: false
        always_run: true

      # Block placeholder implementations
      - id: no-placeholders
        name: No placeholder implementations
        entry: "bash -c 'if grep -rn \"not implemented\" --include=\"*.ts\" --include=\"*.tsx\" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=lib . 2>/dev/null; then echo ERROR - Implement fully, no placeholders; exit 1; fi; exit 0'"
        language: system
        pass_filenames: false
        always_run: true

      # Enforce test naming convention (it('should...when...'))
      - id: test-naming
        name: Test naming convention
        entry: "bash -c 'INVALID=$(grep -rn \"^\\s*it(\" --include=\"*.test.ts\" --include=\"*.spec.ts\" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=lib . 2>/dev/null | grep -v should || true); if [ -n \"$INVALID\" ]; then echo ERROR - Test names must use should pattern; echo \"$INVALID\"; exit 1; fi; exit 0'"
        language: system
        pass_filenames: false
        always_run: true

# CI runs these same checks
ci:
  autofix_commit_msg: "style: auto-fix pre-commit issues"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
