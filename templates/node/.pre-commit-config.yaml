# TIM Design Standards - Node.js Pre-commit Configuration
# Copy this file to your project root
# Run: pre-commit install

repos:
  # Local hooks for Node.js tooling
  - repo: local
    hooks:
      # TypeScript type checking
      - id: tsc
        name: TypeScript type check
        entry: npx tsc --noEmit
        language: system
        types: [typescript]
        pass_filenames: false

      # ESLint with zero warnings tolerance
      - id: eslint
        name: ESLint
        entry: npx eslint --max-warnings 0 --fix
        language: system
        types: [typescript]
        pass_filenames: true

      # Prettier formatting check
      - id: prettier
        name: Prettier
        entry: npx prettier --check
        language: system
        types_or: [typescript, javascript, json, css, markdown, yaml]
        pass_filenames: true

  # Gitleaks - Detect secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Commitizen - Enforce commit message format
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  # CLAUDE.md Enforcement - Catch AI instruction violations
  - repo: local
    hooks:
      # Block TODO/FIXME comments
      - id: no-todos
        name: No TODO/FIXME comments
        entry: bash -c 'if grep -rn "TODO\|FIXME\|XXX\|HACK" --include="*.ts" --include="*.tsx" src/ 2>/dev/null; then echo "ERROR: Remove TODO/FIXME comments - implement fully or do not add"; exit 1; fi; exit 0'
        language: system
        pass_filenames: false
        always_run: true

      # Block console.log (must use logger)
      - id: no-console
        name: No console.log
        entry: bash -c 'if grep -rn "console\.log\|console\.debug\|console\.info" --include="*.ts" --include="*.tsx" src/ 2>/dev/null | grep -v "// noqa"; then echo "ERROR: Use logger instead of console.log"; exit 1; fi; exit 0'
        language: system
        pass_filenames: false
        always_run: true

      # Block any type
      - id: no-any
        name: No any type
        entry: bash -c 'if grep -rn ": any\|as any\|<any>" --include="*.ts" --include="*.tsx" src/ 2>/dev/null | grep -v "// noqa"; then echo "ERROR: Use proper types instead of any"; exit 1; fi; exit 0'
        language: system
        pass_filenames: false
        always_run: true

      # Block placeholder implementations
      - id: no-placeholders
        name: No placeholder implementations
        entry: bash -c 'if grep -rn "throw new Error.*not implemented\|// TODO\|// FIXME" --include="*.ts" --include="*.tsx" src/ 2>/dev/null; then echo "ERROR: Implement fully - no placeholders"; exit 1; fi; exit 0'
        language: system
        pass_filenames: false
        always_run: true

      # Enforce co-author line in commits
      - id: require-coauthor
        name: Require Co-Authored-By line
        entry: bash -c 'if ! grep -q "Co-Authored-By:" "$1" 2>/dev/null; then echo "ERROR: Commit must include Co-Authored-By line"; exit 1; fi'
        language: system
        stages: [commit-msg]

# CI runs these same checks
ci:
  autofix_commit_msg: "style: auto-fix pre-commit issues"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
