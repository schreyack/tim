# TIM Standards - Node.js Pre-commit Configuration
# Base template - used by bin/sync-pre-commit
# Run: pre-commit install

repos:
  # LOCKED - Prevent AI from modifying enforcement files
  - repo: local
    hooks:
      - id: protect-enforcement-files
        name: LOCKED - enforcement files require human approval to modify
        entry: "bash -c 'printf \"BLOCKED: These enforcement files require --no-verify (human approval):\\n\"; for f; do printf \"  %s\\n\" \"$f\"; done; exit 1' --"
        language: system
        files: >-
          (?x)^(
            \.gitignore|
            \.pre-commit-config\.yaml|
            \.secrets\.baseline|
            \.tim-settings-sot\.yaml
          )$

  # Local hooks for Node.js tooling
  - repo: local
    hooks:
      # TypeScript type checking
      - id: tsc
        name: TypeScript type check
        entry: ./node_modules/.bin/tsc --noEmit
        language: system
        types: [ts]
        pass_filenames: false

      # ESLint with zero warnings tolerance
      - id: eslint
        name: ESLint
        entry: ./node_modules/.bin/eslint --max-warnings 0 --no-warn-ignored --fix
        language: system
        types: [ts]
        pass_filenames: true

      # Prettier formatting check
      - id: prettier
        name: Prettier
        entry: ./node_modules/.bin/prettier --check
        language: system
        types_or: [ts, javascript, json, css, markdown, yaml]
        pass_filenames: true

  # Gitleaks - Detect secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Commitizen - Enforce commit message format
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  # Settings SOT enforcement - No hardcoded defaults or fallbacks
  - repo: local
    hooks:
      - id: no-hardcoded-settings
        name: No hardcoded settings (SOT enforcement)
        entry: python3 lib/tim/tools/no-hardcoded-settings.py --language typescript --tier block
        language: system
        types_or: [ts, tsx]

  # CLAUDE.md Enforcement - Catch AI instruction violations
  - repo: local
    hooks:
      # Code quality: 400 line files max
      - id: code-quality
        name: Code quality (file size)
        entry: python3 lib/tim/tools/check-code-quality.py --language typescript
        language: system
        types_or: [ts, tsx]

      # Block TODO/FIXME comments
      - id: no-todos
        name: No TODO/FIXME comments
        entry: "bash -c 'if grep -rn -E \"TODO|FIXME|XXX\" --include=\"*.ts\" --include=\"*.tsx\" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=lib . 2>/dev/null; then echo ERROR - Remove TODO/FIXME/XXX comments; exit 1; fi; exit 0'"
        language: system
        pass_filenames: false
        always_run: true

      # Block console.log (must use logger)
      - id: no-console
        name: No console.log
        entry: "bash -c 'if grep -rn \"console\\.log\" --include=\"*.ts\" --include=\"*.tsx\" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=lib . 2>/dev/null | grep -v noqa; then echo ERROR - Use logger instead of console.log; exit 1; fi; exit 0'"
        language: system
        pass_filenames: false
        always_run: true

      # Block any type
      - id: no-any
        name: No any type
        entry: "bash -c 'if grep -rn -E \"(: any|as any|<any>)\" --include=\"*.ts\" --include=\"*.tsx\" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=lib . 2>/dev/null | grep -v noqa; then echo ERROR - Use proper types instead of any; exit 1; fi; exit 0'"
        language: system
        pass_filenames: false
        always_run: true

      # Block placeholder implementations
      - id: no-placeholders
        name: No placeholder implementations
        entry: "bash -c 'if grep -rin \"not implemented\" --include=\"*.ts\" --include=\"*.tsx\" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=lib . 2>/dev/null; then echo ERROR - Implement fully, no placeholders; exit 1; fi; exit 0'"
        language: system
        pass_filenames: false
        always_run: true

# CI runs these same checks
ci:
  autofix_commit_msg: "style: auto-fix pre-commit issues"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
