# TIM Design Standards - Python CI Pipeline
# Copy to: .github/workflows/ci.yml
#
# This pipeline implements Gate 2 (CI) checks:
# - Type checking (mypy --strict)
# - Linting (ruff)
# - Formatting (ruff format)
# - Tests with coverage (90% minimum)
# - Security scanning (bandit, safety, trivy)
# - Secrets detection (trufflehog)
#
# Merge is BLOCKED if any check fails.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ==========================================================================
  # GATE 2: Type Checking
  # ==========================================================================
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install

      - name: Run mypy (strict mode)
        run: poetry run mypy --strict src/

  # ==========================================================================
  # GATE 2: Linting, Formatting & Complexity
  # ==========================================================================
  lint:
    name: Lint, Format & Complexity (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check (includes complexity)
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

      - name: Check file sizes (max 400 lines)
        run: |
          echo "Checking file sizes..."
          failed=0
          for f in $(find src -name "*.py" -type f 2>/dev/null); do
            lines=$(wc -l < "$f")
            if [ $lines -gt 400 ]; then
              echo "ERROR: $f has $lines lines (max 400)"
              failed=1
            fi
          done
          if [ $failed -eq 1 ]; then
            echo ""
            echo "Files exceeding 400 lines must be split."
            echo "See: standards/coding/code-organization.md"
            exit 1
          fi
          echo "All files within size limits"

  # ==========================================================================
  # GATE 2: Tests with Coverage
  # ==========================================================================
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: |
          poetry run pytest \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=90

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: true

  # ==========================================================================
  # GATE 2: Security Scanning
  # ==========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install bandit safety

      - name: Run bandit (code scan)
        run: bandit -r src/ -ll -ii

      - name: Run safety (dependency scan)
        run: |
          pip install poetry
          poetry export -f requirements.txt --output requirements.txt
          safety check -r requirements.txt --full-report

  # ==========================================================================
  # GATE 2: Secrets Detection
  # ==========================================================================
  secrets:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for deep scan

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ==========================================================================
  # GATE 2: Container Scanning (if Dockerfile exists)
  # ==========================================================================
  container:
    name: Container Scan
    runs-on: ubuntu-latest
    if: hashFiles('**/Dockerfile') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t app:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: app:scan
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

  # ==========================================================================
  # GATE 2: All Checks Must Pass
  # ==========================================================================
  gate2-complete:
    name: Gate 2 Complete
    needs: [typecheck, lint, test, security, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "Gate 2 (CI) checks passed. PR is ready for review."

