# TIM Standards - Node.js/TypeScript CI Pipeline
# Copy to: .github/workflows/ci.yml
#
# This pipeline implements Gate 2 (CI) checks:
# - Type checking (tsc --noEmit)
# - Linting (eslint --max-warnings 0)
# - Formatting (prettier --check)
# - Tests with coverage (reported, no gate)
# - Security scanning (npm audit, trivy)
# - Secrets detection (trufflehog)
#
# Merge is BLOCKED if any check fails.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"

jobs:
  # ==========================================================================
  # GATE 2: Type Checking
  # ==========================================================================
  typecheck:
    name: Type Check (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

  # ==========================================================================
  # GATE 2: Linting, Formatting & Complexity
  # ==========================================================================
  lint:
    name: Lint, Format & Complexity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (zero warnings, includes complexity)
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Check file sizes (max 500 lines)
        run: |
          echo "Checking file sizes..."
          failed=0
          for f in $(find src -type f \( -name "*.ts" -o -name "*.tsx" \) 2>/dev/null | grep -v node_modules); do
            lines=$(wc -l < "$f")
            if [ $lines -gt 500 ]; then
              echo "ERROR: $f has $lines lines (max 500)"
              failed=1
            fi
          done
          if [ $failed -eq 1 ]; then
            echo ""
            echo "Files exceeding 500 lines must be split."
            echo "See: standards/coding/code-organization.md"
            exit 1
          fi
          echo "All files within size limits"

  # ==========================================================================
  # GATE 2: Tests with Coverage
  # ==========================================================================
  test:
    name: Tests (vitest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: npm run test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/coverage-final.json
          fail_ci_if_error: true

  # ==========================================================================
  # GATE 2: Security Scanning
  # ==========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true  # Don't fail if Snyk unavailable
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # ==========================================================================
  # GATE 2: Secrets Detection
  # ==========================================================================
  secrets:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for deep scan

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ==========================================================================
  # GATE 2: Container Scanning (if Dockerfile exists)
  # ==========================================================================
  container:
    name: Container Scan
    runs-on: ubuntu-latest
    if: hashFiles('**/Dockerfile') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t app:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: app:scan
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

  # ==========================================================================
  # GATE 2: Build Check
  # ==========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ==========================================================================
  # GATE 4: Pattern Compliance
  # ==========================================================================
  compliance:
    name: Pattern Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check .tim-patterns.yaml exists
        run: |
          if [ ! -f ".tim-patterns.yaml" ]; then
            echo "ERROR: .tim-patterns.yaml not found"
            echo "Every TIM project requires a pattern registry."
            echo "Copy from: templates/tim-patterns.yaml.template"
            exit 1
          fi

      - name: Run compliance check
        run: |
          # Download compliance checker if not present
          if [ ! -f "./tools/tim-compliance-check.sh" ]; then
            curl -sSL https://raw.githubusercontent.com/your-org/design_standards/main/tools/tim-compliance-check.sh -o tim-compliance-check.sh
            chmod +x tim-compliance-check.sh
          else
            cp ./tools/tim-compliance-check.sh tim-compliance-check.sh
          fi
          ./tim-compliance-check.sh --ci

      - name: Verify shared library installed
        run: |
          if grep -q "@tim/lib" package.json 2>/dev/null; then
            echo "@tim/lib dependency found"
          else
            echo "WARNING: @tim/lib not found in dependencies"
            echo "Consider adding: npm install @tim/lib"
          fi

  # ==========================================================================
  # GATE 2: All Checks Must Pass
  # ==========================================================================
  gate2-complete:
    name: Gate 2 Complete
    needs: [typecheck, lint, test, security, secrets, build, compliance]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "Gate 2 (CI) and Gate 4 (Compliance) checks passed. PR is ready for review."

