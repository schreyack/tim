[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyplan-ops"
version = "0.2.0"
description = "Python-based plan orchestrator for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "TIM Standards" }
]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "mypy>=1.0",
    "ruff>=0.1",
]
rich = [
    "rich>=13.0",
]

[project.scripts]
pyplan-ops = "pyplan_ops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pyplan_ops"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
