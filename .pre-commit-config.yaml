# TIM Standards Repository - Pre-commit Configuration
# This repo contains both Python and Node.js shared libraries
# Run: pre-commit install

repos:
  # =============================================================================
  # PYTHON HOOKS (libs/python/)
  # =============================================================================

  # Ruff - Fast linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^libs/python/
      - id: ruff-format
        files: ^libs/python/

  # MyPy - Type checking
  # Note: Disabled in pre-commit due to type stub issues with python-jose
  # Run manually: cd libs/python && poetry run mypy tim_lib
  # TODO: Re-enable when python-jose type stubs are updated
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.13.0
  #   hooks:
  #     - id: mypy
  #       args: [--ignore-missing-imports]
  #       files: ^libs/python/tim_lib/
  #       additional_dependencies:
  #         - pydantic>=2.0
  #         - types-passlib
  #         - types-python-jose

  # Bandit - Python security scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: [-r, libs/python/tim_lib/, -ll]
        pass_filenames: false

  # =============================================================================
  # NODE.JS HOOKS (libs/node/)
  # =============================================================================

  # Node.js type checking
  # Note: Temporarily disabled due to exactOptionalPropertyTypes edge cases
  # Run manually: cd libs/node && npx tsc --noEmit
  # TODO: Fix type issues and re-enable
  # - repo: local
  #   hooks:
  #     - id: tsc-node
  #       name: TypeScript type check (libs/node)
  #       entry: bash -c 'cd libs/node && npx tsc --noEmit'
  #       language: system
  #       files: ^libs/node/.*\.ts$
  #       pass_filenames: false
  #
  #     - id: eslint-node
  #       name: ESLint (libs/node)
  #       entry: bash -c 'cd libs/node && npx eslint --max-warnings 0 src/'
  #       language: system
  #       files: ^libs/node/src/.*\.ts$
  #       pass_filenames: false

  # =============================================================================
  # GENERAL HOOKS
  # =============================================================================

  # Detect secrets - Prevent committing secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: package-lock\.json|poetry\.lock

  # Note: Using detect-secrets instead of gitleaks to avoid conflicts
  # with .secrets.baseline file which gitleaks flags incorrectly

  # Commitizen - Enforce commit message format
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
        exclude: ^templates/|^examples/
      - id: check-json
        exclude: tsconfig\.json$
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  # Shellcheck for bash scripts
  # Using severity=error to ignore style/info warnings
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=error]
        files: ^tools/.*\.sh$

  # =============================================================================
  # CLAUDE.md ENFORCEMENT
  # =============================================================================

  - repo: local
    hooks:
      # Block TODO/FIXME comments in Python
      - id: no-todos-python
        name: No TODO/FIXME comments (Python)
        entry: bash -c 'grep -rn "TODO\|FIXME\|XXX\|HACK" --include="*.py" libs/python/tim_lib/ 2>/dev/null && exit 1 || exit 0'
        language: system
        files: ^libs/python/
        pass_filenames: false

      # Block TODO/FIXME comments in TypeScript
      - id: no-todos-node
        name: No TODO/FIXME comments (Node.js)
        entry: bash -c 'grep -rn "TODO\|FIXME\|XXX\|HACK" --include="*.ts" libs/node/src/ 2>/dev/null && exit 1 || exit 0'
        language: system
        files: ^libs/node/
        pass_filenames: false

      # Block print statements (Python)
      - id: no-print-python
        name: No print statements (Python)
        entry: bash -c 'grep -rn "^\s*print(" --include="*.py" libs/python/tim_lib/ 2>/dev/null | grep -v "# noqa" && exit 1 || exit 0'
        language: system
        files: ^libs/python/tim_lib/
        pass_filenames: false

      # Block console.log (Node.js)
      - id: no-console-node
        name: No console.log (Node.js)
        entry: bash -c 'grep -rn "console\.log\|console\.debug\|console\.info" --include="*.ts" libs/node/src/ 2>/dev/null | grep -v "// noqa" && exit 1 || exit 0'
        language: system
        files: ^libs/node/src/
        pass_filenames: false

      # Enforce co-author line in commits (disabled - conflicts with commitizen)
      # Enable manually if not using commitizen:
      # - id: require-coauthor
      #   name: Require Co-Authored-By line
      #   entry: bash -c 'grep -q "Co-Authored-By" "$1" || exit 1'
      #   language: system
      #   stages: [commit-msg]

# CI runs these same checks
ci:
  autofix_commit_msg: "style: auto-fix pre-commit issues"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
